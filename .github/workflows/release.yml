name: Release WordPress plugin

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build installable ZIP
        env:
          PLUGIN_SLUG: ${{ github.event.repository.name }}
        run: |
          test -f "${PLUGIN_SLUG}.php" || test -f "${PLUGIN_SLUG}-core.php"
          PACKAGE_DIR="${RUNNER_TEMP}/${PLUGIN_SLUG}"
          mkdir -p "${PACKAGE_DIR}"
          rsync -a --delete \
            --exclude '.git' --exclude '.github' --exclude 'tests' --exclude 'vendor/bin' \
            --exclude '.phpunit.result.cache' --exclude 'node_modules' --exclude 'docs' \
            ./ "${PACKAGE_DIR}/"
          (cd "${RUNNER_TEMP}" && zip -qr "${GITHUB_WORKSPACE}/${PLUGIN_SLUG}.zip" "${PLUGIN_SLUG}")
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "${{ github.event.repository.name }}.zip" --generate-notes --verify-tag
