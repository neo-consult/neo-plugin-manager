name: Release WordPress plugin

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          MAIN_FILE="$(find . -maxdepth 1 -type f -name '*.php' -print0 | xargs -0 grep -l -m1 '^[[:space:]]*\* Version:' | head -n1)"
          test -n "${MAIN_FILE}"
          VERSION="$(sed -nE 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*([^[:space:]]+).*/\1/p' "${MAIN_FILE}" | head -n1)"
          test -n "${VERSION}"
          test "v${VERSION}" = "${RELEASE_TAG}"

      - name: Build installable ZIP and checksum
        id: package
        env:
          PLUGIN_SLUG: ${{ github.event.repository.name }}
        run: |
          PACKAGE_DIR="${RUNNER_TEMP}/${PLUGIN_SLUG}"
          mkdir -p "${PACKAGE_DIR}"
          rsync -a --delete \
            --exclude '.git' --exclude '.github' --exclude 'tests' --exclude 'vendor' \
            --exclude '.phpunit.result.cache' --exclude 'node_modules' --exclude 'docs' \
            --exclude 'wp-content' --exclude '*.zip' ./ "${PACKAGE_DIR}/"
          (cd "${RUNNER_TEMP}" && zip -qr "${GITHUB_WORKSPACE}/${PLUGIN_SLUG}.zip" "${PLUGIN_SLUG}")
          echo "sha256=$(sha256sum "${PLUGIN_SLUG}.zip" | awk '{print $1}')" >> "${GITHUB_OUTPUT}"

      - name: Require catalog publishing credential
        env:
          CATALOG_TOKEN: ${{ secrets.NEO_CATALOG_TOKEN }}
        run: test -n "${CATALOG_TOKEN}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "${{ github.event.repository.name }}.zip" --generate-notes --verify-tag

      - name: Update official plugin catalog
        uses: actions/checkout@v4
        with:
          repository: neo-consult/neo-plugin-catalog
          token: ${{ secrets.NEO_CATALOG_TOKEN }}
          path: catalog

      - name: Write release metadata to catalog
        env:
          PLUGIN_SLUG: ${{ github.event.repository.name }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA256: ${{ steps.package.outputs.sha256 }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('catalog/plugins.json')
          catalog = json.loads(path.read_text(encoding='utf-8'))
          slug = os.environ['PLUGIN_SLUG']
          entry = next((item for item in catalog['plugins'] if item['slug'] == slug), None)
          if entry is None:
              raise SystemExit(f'Plugin {slug} fehlt im Katalog')
          entry['version'] = os.environ['RELEASE_TAG'].removeprefix('v')
          entry['package'] = f"https://github.com/{os.environ['REPOSITORY']}/releases/download/{os.environ['RELEASE_TAG']}/{slug}.zip"
          entry['sha256'] = os.environ['RELEASE_SHA256']
          entry['published'] = True
          path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit catalog update
        working-directory: catalog
        env:
          PLUGIN_SLUG: ${{ github.event.repository.name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git config user.name "neo-consult-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add plugins.json
          git diff --cached --quiet || git commit -m "Release ${PLUGIN_SLUG} ${RELEASE_TAG}"
          git push
